name: Wiqo Windows

on:
  push:
    paths:
      - "RovaWindows/**"
      - "RovaShared/**"
      - "RovaBrowserWorker/**"
      - "RovaDocumentWorker/**"
      - "contracts/companion/**"
      - ".github/workflows/rova-windows.yml"
  pull_request:
    paths:
      - "RovaWindows/**"
      - "RovaShared/**"
      - "RovaBrowserWorker/**"
      - "RovaDocumentWorker/**"
      - "contracts/companion/**"
      - ".github/workflows/rova-windows.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to receive the Windows installers
        required: true
        default: v1.1.0-7
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contract vectors are current
        run: node contracts/companion/generate-vectors.mjs --check
      - name: Restore
        run: dotnet restore RovaWindows/RovaWindows.sln
      - name: Build (core, tray app, tests)
        run: dotnet build RovaWindows/RovaWindows.sln --configuration Release --no-restore
      - name: Test (contract, parity, terminal incl. PowerShell)
        run: dotnet test RovaWindows/RovaWindows.sln --configuration Release --no-build --no-restore
      - name: Publish Wiqo.exe (x64, ARM64)
        shell: bash
        run: |
          RovaWindows/scripts/publish.sh
          cp RovaWindows/dist/win-x64/Wiqo.exe RovaWindows/dist/Wiqo-win-x64.exe
          cp RovaWindows/dist/win-arm64/Wiqo.exe RovaWindows/dist/Wiqo-win-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wiqo-windows
          path: RovaWindows/dist/Wiqo-win-*.exe
          retention-days: 14

  release-assets:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wiqo-windows
          path: release-assets
      - name: Attach Windows packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/Wiqo-win-x64.exe release-assets/Wiqo-win-arm64.exe --repo "$GITHUB_REPOSITORY" --clobber

  # The Mac side of the same contract: RovaShared against vectors.json, and operations.json is
  # the current export of RovaShared's operation catalogue.
  mac-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift contract check
        run: |
          xcrun swiftc -O -o contract-swift RovaShared/*.swift contracts/companion/swift/main.swift
          ./contract-swift contracts/companion/vectors.json contracts/companion/operations.json
